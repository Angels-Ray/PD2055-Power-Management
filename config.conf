# PD2055 Charge
# 电流单位 mA，温度单位 0.1 C，间隔单位 ms。

# 启用限流
enabled=1
# 输入电流上限 [mA]
max_input_ma=3300
# 温度到达停止阈值时使用的限流值 [mA]
min_input_ma=500
# SOC 达到或超过这个值时释放 [%]
soc_full=85
# 高于这个 SOC 时缩放限流值 [%]
soc_mid=75
# 高于 soc_mid 时的缩放比例 [%]
soc_mid_scale=70
# 目标值第一次乘 60% 的电池温度 [0.1 C]
temp_derate_dc=360
# 使用 min_input_ma 的电池温度 [0.1 C]
temp_stop_dc=420
# 目标值第一次乘 60% 的主板温度 [0.1 C]
board_temp_derate_dc=520
# 使用 min_input_ma 的主板温度 [0.1 C]
board_temp_stop_dc=600
# 控制中的轮询间隔 [ms]
poll_active_ms=10000
# 空闲时的轮询间隔 [ms]
poll_idle_ms=60000
