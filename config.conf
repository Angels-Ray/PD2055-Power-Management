# PD2055 Charge
# 电流单位 mA，温度单位 0.1 C，间隔单位 ms。

# 启用控制
enabled=1
# 启用直充提速
boost_enabled=1
# 达到或超过这个 SOC 时停止提速 [%]
boost_soc_max=40
# 提速时的电池电流请求 [mA]
boost_ma=6600
# 提速时 MCU 使用的线阻 [mOhm]
boost_cable_mohm=100
# 输入电流上限 [mA]
max_input_ma=5000
# 电池或主板达到停止温度时使用的限流 [mA]
min_input_ma=500
# 达到这个 SOC 时停止充电；100 表示不限制 [%]
charge_limit_soc=100
# 高于这个 SOC 后输入电流乘缩放比例 [%]
soc_mid=90
# 高于 soc_mid 时的缩放比例 [%]
soc_mid_scale=100
# 电池降额温度 [0.1 C]
temp_derate_dc=420
# 电池停止温度 [0.1 C]
temp_stop_dc=450
# 主板降额温度 [0.1 C]
board_temp_derate_dc=550
# 主板停止温度 [0.1 C]
board_temp_stop_dc=600
# 到降额温度后输入和提速目标乘这个比例 [%]
temp_derate_scale=60
# 控制中的轮询间隔 [ms]
poll_active_ms=10000
# 空闲时的轮询间隔 [ms]
poll_idle_ms=60000

# 接管 CPU 频率
thermal_cpu=0
# 按温控规则限制充电电流
thermal_charge=0
# 按温控规则管理 CPU5、CPU6、CPU7 的在线状态
thermal_online=0
# 温控检测间隔 [ms]
thermal_interval_ms=5000
# 电池未充电且温度比最低规则低超过 2.0 C 时的温控检测间隔 [ms]
thermal_idle_interval_ms=15000
# 温控规则：温度 [0.1 C]，小核 [MHz]，大核 [MHz]，超大核 [MHz]，充电电流 [mA]，大核在线数，超大核在线数
thermal_rule=400,1804,2419,2265,3000,3,1
thermal_rule=440,1612,2150,2073,2500,2,1
thermal_rule=480,1401,1862,1862,1800,2,0
thermal_rule=520,1171,1574,1632,1000,1,0
